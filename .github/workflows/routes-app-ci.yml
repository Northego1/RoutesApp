name: CI-PIPELINE

on:
  push:
    branches: master


jobs:
  testing:  
    runs-on: ubuntu-latest
    
    steps: 
    - name: github-clone
      uses: actions/checkout@v1
  
    - name: setup-python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
  
    - name: install-uv
      run: |
        python -m pip install --upgrade pip
        pip install uv
  
    - name: install-dependencies
      run: |
        uv sync
  
    - name: pytests
      run: |
        uv run pytest
      
